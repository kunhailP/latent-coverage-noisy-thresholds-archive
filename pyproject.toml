[project]
name = "latent-coverage-noisy-thresholds"
version = "1.0.0"
description = "Latent coverage of noisy calibration thresholds: code for the paper"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "rdata>=0.11",
    "python-flint>=0.6",
]

[project.optional-dependencies]
test = ["pytest>=7", "mpmath>=1.3"]
figures = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
